<style>
  :root {
    /* CLAP Theme — Jet Stream #B2D5E5 + Blue Whale #1a4a6e */
    --bg-deep: #b2d5e5;
    --bg-mid: #c4dff0;
    --bg-card: #f0f7fb;
    --bg-card2: #e4f2fb;
    --bg-app: linear-gradient(160deg, #b2d5e5 0%, #c4dff0 45%, #d8edf7 100%);
    --border: rgba(26, 74, 110, 0.1);
    --border-glow: rgba(26, 74, 110, 0.4);
    --accent: #1a4a6e;
    --accent2: #2a6496;
    --accent3: #c0392b;
    --accent4: #1a8a4a;
    --accent5: #d4820a;
    --gold: #c9962a;
    --text-1: #0d2a3e;
    --text-2: #1a4a6e;
    --text-3: #4a7a9e;
    /* Glass surfaces — teal-tinted Apple liquid glass */
    --glass: rgba(178, 213, 229, 0.52);
    --glass-strong: rgba(196, 223, 240, 0.72);
    --glass-thin: rgba(178, 213, 229, 0.32);
    --glass-border: rgba(255, 255, 255, 0.82);
    --glass-border-soft: rgba(255, 255, 255, 0.55);
    --glass-tint: rgba(26, 74, 110, 0.06);
    --grad-hero: linear-gradient(135deg, #b2d5e5 0%, #c4dff0 50%, #d8edf7 100%);
    --grad-card: linear-gradient(145deg, rgba(255, 255, 255, 0.88), rgba(196, 223, 240, 0.65));
    --grad-prime: linear-gradient(135deg, #1a4a6e 0%, #2a6496 55%, #3a84c0 100%);
    --grad-glow: linear-gradient(135deg, rgba(26, 74, 110, 0.12) 0%, rgba(42, 100, 150, 0.08) 100%);
    --grad-green: linear-gradient(135deg, #1a8a4a, #0ab87c);
    --grad-red: linear-gradient(135deg, #e05044, #c0392b);
    --grad-gold: linear-gradient(135deg, #d4820a, #b86a00);
    --shadow: 0 8px 32px rgba(26, 74, 110, 0.14);
    --shadow-soft: 0 4px 20px rgba(26, 74, 110, 0.10);
    --shadow-lg: 0 24px 70px rgba(26, 74, 110, 0.22);
    --shadow-glow: 0 8px 32px rgba(26, 74, 110, 0.22);
    --shadow-inset: inset 0 1px 1px rgba(255, 255, 255, 0.95), inset 0 -1px 2px rgba(26, 74, 110, 0.05), inset 1px 0 1px rgba(255, 255, 255, 0.55), inset -1px 0 1px rgba(255, 255, 255, 0.55);
    --blur: 6px;
    --blur-strong: 10px;
    --radius: 20px;
    --radius-sm: 14px;
    --radius-xs: 10px;
    --font: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'Inter', system-ui, sans-serif;
    --font-head: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', system-ui, sans-serif;
    --ease: cubic-bezier(0.25, 0.46, 0.45, 0.94);
    --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
    --ease-spring: cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html {
    scroll-behavior: smooth;
    text-rendering: optimizeLegibility;
    -webkit-text-size-adjust: 100%;
    font-size: 100%;
  }

  body {
    font-family: var(--font);
    background: var(--bg-deep);
    color: var(--text-1);
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    letter-spacing: -0.01em;
  }

  /* Ambient living background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -2;
    background: var(--bg-app);
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
      radial-gradient(ellipse 55% 48% at 10% 8%, rgba(26, 74, 110, 0.18) 0%, transparent 60%),
      radial-gradient(ellipse 45% 52% at 90% 92%, rgba(42, 100, 150, 0.16) 0%, transparent 60%),
      radial-gradient(ellipse 40% 40% at 82% 10%, rgba(58, 132, 192, 0.12) 0%, transparent 55%),
      radial-gradient(ellipse 48% 44% at 15% 88%, rgba(178, 213, 229, 0.3) 0%, transparent 55%),
      radial-gradient(ellipse 36% 36% at 52% 52%, rgba(26, 74, 110, 0.08) 0%, transparent 60%);
  }

  @keyframes auroraDrift {
    0% {
      transform: translate(0, 0) scale(1);
    }

    50% {
      transform: translate(2%, -1.5%) scale(1.05);
    }

    100% {
      transform: translate(-2%, 1.5%) scale(1.02);
    }
  }

  @media(prefers-reduced-motion:reduce) {
    body::after {
      animation: none;
    }

    * {
      animation-duration: 0.01ms !important;
      transition-duration: 0.08s !important;
    }
  }

  ::-webkit-scrollbar {
    width: 10px;
    height: 10px;
  }

  ::-webkit-scrollbar-track {
    background: transparent;
  }

  ::-webkit-scrollbar-thumb {
    background: rgba(15, 23, 42, 0.18);
    border-radius: 10px;
    border: 2px solid transparent;
    background-clip: padding-box;
  }

  ::-webkit-scrollbar-thumb:hover {
    background: rgba(15, 23, 42, 0.3);
    background-clip: padding-box;
  }

  /* ═══════════ LIQUID GLASS CORE ═══════════ */
  /* Fullscreen import modals — one cohesive glass panel */
  .fullscreen-modal {
    position: fixed;
    inset: 0;
    z-index: 600;
    background: rgba(15, 23, 42, 0.28);
    backdrop-filter: blur(6px) saturate(120%);
    -webkit-backdrop-filter: blur(6px) saturate(120%);
    display: none;
    padding: 32px;
    animation: overlayFade 0.3s var(--ease);
  }

  .fullscreen-modal.open {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .fullscreen-header {
    flex-shrink: 0;
    width: 100%;
    max-width: 920px;
    background: var(--glass-strong);
    backdrop-filter: blur(var(--blur-strong)) saturate(200%);
    -webkit-backdrop-filter: blur(var(--blur-strong)) saturate(200%);
    border: 1px solid var(--glass-border);
    border-radius: 24px 24px 0 0;
    border-bottom: none;
    padding: 22px 28px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    box-shadow: var(--shadow-lg);
  }

  .fullscreen-header h2 {
    font-family: var(--font-head);
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--text-1);
    letter-spacing: -0.02em;
  }

  .import-stats {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .import-stat {
    font-size: 0.85rem;
    font-weight: 600;
  }

  .fullscreen-body {
    flex: 1;
    width: 100%;
    max-width: 920px;
    overflow-y: auto;
    background: rgba(255, 255, 255, 0.5);
    backdrop-filter: blur(var(--blur)) saturate(180%);
    -webkit-backdrop-filter: blur(var(--blur)) saturate(180%);
    border-left: 1px solid var(--glass-border);
    border-right: 1px solid var(--glass-border);
    padding: 20px 28px;
    box-shadow: var(--shadow-lg);
  }

  .fullscreen-footer {
    flex-shrink: 0;
    width: 100%;
    max-width: 920px;
    background: var(--glass-strong);
    backdrop-filter: blur(var(--blur-strong)) saturate(200%);
    -webkit-backdrop-filter: blur(var(--blur-strong)) saturate(200%);
    border: 1px solid var(--glass-border);
    border-radius: 0 0 24px 24px;
    border-top: 1px solid rgba(15, 23, 42, 0.07);
    padding: 18px 28px;
    display: flex;
    justify-content: flex-end;
    gap: 12px;
    box-shadow: var(--shadow-lg);
  }

  /* Import row cards — match actual structure: [num][fields][toggle] */
  .import-row-card {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    margin-bottom: 8px;
    background: rgba(255, 255, 255, 0.62);
    border: 1px solid var(--glass-border-soft);
    border-radius: 14px;
    transition: background 0.08s ease, transform 0.08s ease, border-color 0.08s ease, box-shadow 0.08s ease;
    box-shadow: var(--shadow-inset);
  }

  .import-row-card:hover {
    border-color: var(--border-glow);
    box-shadow: 0 4px 12px rgba(26, 74, 110, 0.1);
  }

  .import-row-card.excluded {
    opacity: 0.4;
    filter: grayscale(0.5);
  }

  .import-row-card .row-num {
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--text-3);
    min-width: 24px;
    text-align: center;
    flex-shrink: 0;
  }

  .import-row-card .row-fields {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .import-row-card input[type=text],
  .import-row-card input:not([type]),
  .import-row-card input[type=date],
  .import-row-card input[type=time],
  .import-row-card select {
    background: rgba(255, 255, 255, 0.75);
    border: 1px solid rgba(15, 23, 42, 0.1);
    border-radius: 9px;
    padding: 8px 11px;
    color: var(--text-1);
    font-family: var(--font);
    font-size: 0.83rem;
    outline: none;
    transition: background 0.08s ease, transform 0.08s ease, border-color 0.08s ease, box-shadow 0.08s ease;
  }

  .import-row-card input:focus,
  .import-row-card select:focus {
    border-color: var(--accent);
    background: #fff;
    box-shadow: 0 0 0 3px rgba(26, 74, 110, 0.1);
  }

  .import-row-card .row-toggle {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }

  .import-row-card .tick-btn,
  .import-row-card .cross-btn {
    width: 32px;
    height: 32px;
    border-radius: 9px;
    border: 1px solid var(--glass-border-soft);
    background: rgba(255, 255, 255, 0.7);
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.08s ease, transform 0.08s ease, border-color 0.08s ease, box-shadow 0.08s ease;
    color: var(--text-3);
  }

  .import-row-card .tick-btn:hover,
  .import-row-card .cross-btn:hover {
    transform: scale(1.12);
  }

  .import-row-card .tick-btn.active {
    background: var(--grad-green);
    color: #fff;
    border-color: transparent;
    box-shadow: 0 3px 10px rgba(48, 209, 88, 0.35);
  }

  .import-row-card .cross-btn.active {
    background: var(--grad-red);
    color: #fff;
    border-color: transparent;
    box-shadow: 0 3px 10px rgba(255, 69, 58, 0.35);
  }

  @media(max-width:860px) {
    .fullscreen-modal {
      padding: 14px;
    }

    .import-row-card {
      flex-wrap: wrap;
    }
  }

  /* LOGIN */
  #loginScreen {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  #loginScreen::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 70% 55% at 18% 12%, rgba(26, 74, 110, 0.22) 0%, transparent 60%), radial-gradient(ellipse 60% 70% at 85% 88%, rgba(58, 132, 192, 0.12) 0%, transparent 60%);
    pointer-events: none;
    animation: auroraDrift 18s ease-in-out infinite alternate;
  }

  .login-wrap {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 520px;
    padding: 24px;
    animation: loginRise 0.8s var(--ease);
  }

  @keyframes loginRise {
    from {
      opacity: 0;
      transform: translateY(40px) scale(0.96);
    }

    to {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  .login-logo {
    text-align: center;
    margin-bottom: 30px;
  }

  .login-logo .brand {
    font-family: var(--font-head);
    font-size: 3rem;
    font-weight: 800;
    background: var(--grad-prime);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -1px;
  }

  .login-logo .sub {
    font-size: 0.74rem;
    color: var(--text-3);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-top: 6px;
    font-weight: 600;
  }

  .login-card {
    background: var(--glass-strong);
    backdrop-filter: blur(var(--blur-strong)) saturate(200%);
    -webkit-backdrop-filter: blur(var(--blur-strong)) saturate(200%);
    border: 1px solid var(--glass-border);
    border-radius: 28px;
    padding: 48px 52px;
    box-shadow: var(--shadow-lg), var(--shadow-inset);
    position: relative;
    overflow: hidden;
  }

  .login-card::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 50%;
    border-radius: 28px 28px 0 0;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.45), transparent);
    pointer-events: none;
  }

  .login-card h2 {
    font-family: var(--font-head);
    font-size: 1.9rem;
    font-weight: 700;
    color: var(--text-1);
    margin-bottom: 6px;
    letter-spacing: -0.02em;
  }

  .login-card .role-hint {
    font-size: 0.85rem;
    color: var(--text-3);
    margin-bottom: 24px;
  }

  .form-group {
    margin-bottom: 18px;
  }

  .form-group label {
    display: block;
    font-size: 0.76rem;
    font-weight: 600;
    color: var(--text-2);
    letter-spacing: 0.3px;
    margin-bottom: 8px;
    text-transform: uppercase;
  }

  .form-group input,
  .form-group select,
  .form-group textarea {
    width: 100%;
    background: rgba(255, 255, 255, 0.6);
    backdrop-filter: blur(4px);
    border: 1px solid rgba(15, 23, 42, 0.1);
    border-radius: var(--radius-sm);
    padding: 14px 16px;
    color: var(--text-1);
    font-family: var(--font);
    font-size: 0.95rem;
    transition: background 0.08s ease, transform 0.08s ease, border-color 0.08s ease, box-shadow 0.08s ease;
    outline: none;
    box-shadow: inset 0 1px 2px rgba(15, 23, 42, 0.04);
  }

  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus {
    border-color: var(--accent);
    background: rgba(255, 255, 255, 0.85);
    box-shadow: 0 0 0 4px rgba(26, 74, 110, 0.12), inset 0 1px 2px rgba(15, 23, 42, 0.04);
  }

  .form-group input::placeholder {
    color: var(--text-3);
  }

  .form-group select option {
    background: #fff;
    color: var(--text-1);
  }

  .input-icon-wrap {
    position: relative;
  }

  .input-icon-wrap input {
    padding-right: 48px;
  }

  .input-icon-wrap .eye-btn {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-3);
    padding: 4px;
    transition: color 0.2s;
  }

  .input-icon-wrap .eye-btn:hover {
    color: var(--accent);
  }

  .btn-primary {
    width: 100%;
    padding: 15px;
    background: var(--grad-prime);
    border: none;
    border-radius: var(--radius-sm);
    color: #fff;
    font-family: var(--font);
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: -0.01em;
    transition: background 0.08s ease, transform 0.08s ease, border-color 0.08s ease, box-shadow 0.08s ease;
    position: relative;
    overflow: hidden;
    box-shadow: 0 6px 20px rgba(26, 74, 110, 0.3), inset 0 1px 1px rgba(255, 255, 255, 0.4);
  }

  .btn-primary::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.35), transparent 60%);
    pointer-events: none;
  }

  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 32px rgba(26, 74, 110, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.4);
  }

  .btn-primary:active {
    transform: translateY(0) scale(0.985);
  }

  .btn-primary:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }

  .login-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 16px;
  }

  .remember-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
  }

  .remember-wrap input[type=checkbox] {
    accent-color: var(--accent);
    width: 16px;
    height: 16px;
  }

  .remember-wrap span {
    font-size: 0.85rem;
    color: var(--text-2);
  }

  .forgot-link {
    font-size: 0.85rem;
    color: var(--accent);
    text-decoration: none;
    font-weight: 500;
  }

  .login-error {
    margin-top: 12px;
    padding: 12px 16px;
    background: rgba(255, 69, 58, 0.1);
    border: 1px solid rgba(255, 69, 58, 0.3);
    border-radius: var(--radius-sm);
    font-size: 0.85rem;
    color: #d70015;
    display: none;
  }

  .login-error.show {
    display: block;
  }

  .otp-wrap {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin: 20px 0;
  }

  .otp-wrap input {
    width: 52px;
    height: 56px;
    text-align: center;
    font-size: 1.4rem;
    font-weight: 700;
    background: rgba(255, 255, 255, 0.6);
    border: 1px solid rgba(15, 23, 42, 0.1);
    border-radius: var(--radius-sm);
    color: var(--text-1);
    outline: none;
    transition: background 0.08s ease, transform 0.08s ease, border-color 0.08s ease, box-shadow 0.08s ease;
  }

  .otp-wrap input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px rgba(26, 74, 110, 0.12);
  }

  /* APP SHELL */
  #appShell {
    display: none;
    min-height: 100vh;
  }

  .sidebar {
    position: fixed;
    top: 14px;
    left: 14px;
    bottom: 14px;
    width: 248px;
    background: rgba(240, 246, 252, 0.96);
    border: 1px solid var(--glass-border);
    border-radius: 24px;
    z-index: 100;
    overflow-y: auto;
    overflow-x: hidden;
    transition: transform 0.32s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.28s ease;
    box-shadow: var(--shadow-lg), var(--shadow-inset);
    will-change: transform;
    transform: translateZ(0);
  }

  .sidebar::-webkit-scrollbar {
    width: 0;
  }

  .sidebar.closed {
    transform: translateX(-280px);
    opacity: 0;
  }

  .sidebar-logo {
    padding: 22px 20px 16px;
    border-bottom: 1px solid rgba(15, 23, 42, 0.06);
  }

  .sidebar-logo .brand {
    font-family: var(--font-head);
    font-size: 1.55rem;
    font-weight: 800;
    background: var(--grad-prime);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -0.5px;
  }

  .sidebar-logo .tagline {
    font-size: 0.66rem;
    color: var(--text-3);
    letter-spacing: 1.5px;
    margin-top: 3px;
    font-weight: 500;
  }

  .sidebar-logo .company-logo-sm {
    width: 100%;
    max-width: 200px;
    max-height: 72px;
    object-fit: contain;
    margin-top: 10px;
    border-radius: 10px;
    display: block;
  }

  .sidebar-user {
    padding: 14px 16px;
    margin: 12px;
    background: var(--grad-glow);
    border: 1px solid rgba(26, 74, 110, 0.18);
    border-radius: var(--radius-sm);
    box-shadow: var(--shadow-inset);
  }

  .sidebar-user .avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--grad-prime);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 0.95rem;
    color: #fff;
    margin-bottom: 8px;
    overflow: hidden;
    box-shadow: 0 4px 12px rgba(26, 74, 110, 0.3);
  }

  .sidebar-user .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .sidebar-user .uname {
    font-size: 0.9rem;
    font-weight: 700;
    color: var(--text-1);
  }

  .sidebar-user .urole {
    font-size: 0.7rem;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 600;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border-radius: 14px;
    cursor: pointer;
    transition: background 0.08s ease, color 0.08s ease;
    color: var(--text-2);
    font-size: 0.93rem;
    font-weight: 500;
    position: relative;
  }

  .nav-item svg {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    opacity: 0.65;
    transition: opacity 0.08s ease;
  }

  .nav-item:hover {
    background: rgba(26, 74, 110, 0.08);
    color: var(--text-1);
  }

  .nav-item:hover svg {
    opacity: 1;
  }

  .nav-item.active {
    background: linear-gradient(135deg, rgba(26, 74, 110, 0.14), rgba(42, 100, 150, 0.09));
    color: var(--accent);
    font-weight: 600;
  }

  .nav-item.active svg {
    opacity: 1;
  }

  .nav-item.active::before {
    content: '';
    position: absolute;
    left: 0;
    top: 20%;
    height: 60%;
    width: 3px;
    background: var(--accent);
    border-radius: 0 3px 3px 0;
  }

  .nav-badge {
    margin-left: auto;
    font-size: 0.7rem;
    font-weight: 700;
    background: var(--accent3);
    color: #fff;
    padding: 2px 7px;

  /* Staff task request bell */
  .task-request-btn {

    align-items: center;
    justify-content: center;
    font-size: 1rem;
    flex-shrink: 0;
    transition: background 0.08s ease, transform 0.08s ease, border-color 0.08s ease, box-shadow 0.08s ease;
  }

  .task-request-btn:hover {
    background: rgba(255, 159, 10, 0.18);
    border-color: rgba(255, 159, 10, 0.6);
    transform: scale(1.1);
  }

  .task-request-btn.requested {
    border-color: rgba(26, 74, 110, 0.35);

  .notif-dot {

    right: 4px;

    height: 8px;

  .main {
    margin-left: 278px;
    padding-top: 74px;
    min-height: 100vh;
    transition: margin-left 0.32s cubic-bezier(0.32, 0.72, 0, 1);

    margin-left: 14px;
  }

  .page {
    display: none;
    padding: 12px 18px 16px;
    contain: layout;
  }

  .page.active {
    display: block;
    animation: pageIn 0.26s cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
  }

  /* Staggered card entrance - snappy */
  .page.active .kpi-card {
    animation: cardPop 0.18s var(--ease) backwards;
  }

  .page.active .kpi-card:nth-child(1) {
    animation-delay: 0.01s;
  }

  .page.active .kpi-card:nth-child(2) {
    animation-delay: 0.03s;
  }

  .page.active .kpi-card:nth-child(3) {
    animation-delay: 0.05s;
  }

  .page.active .kpi-card:nth-child(4) {
    animation-delay: 0.07s;
  }

  .page.active .kpi-card:nth-child(5) {
    animation-delay: 0.09s;
  }

  .page.active .kpi-card:nth-child(6) {
    animation-delay: 0.11s;
  }

  @keyframes cardPop {
    from {
      opacity: 0;
      transform: translateY(6px);
    }

    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* COMPONENTS */

  .page-header .hdr-row {

    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }

  .card {
    background: rgba(255, 255, 255, 0.88);

    border-radius: var(--radius);
    padding: 22px;

    gap: 16px;
    margin-bottom: 24px;
  }

  .kpi-grid:empty {
    display: none;
  }

  .kpi-card {
    background: rgba(255, 255, 255, 0.88);

    border-radius: var(--radius);
    padding: 20px;
    cursor: pointer;
    transition: transform 0.22s cubic-bezier(0.34, 1.28, 0.64, 1), box-shadow 0.22s ease;

    overflow: hidden;
    box-shadow: var(--shadow-soft), var(--shadow-inset);
  }

  .kpi-card::after {

    left: 0;
    right: 0;
    height: 50%;
    border-radius: var(--radius) var(--radius) 0 0;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.35), transparent);
    pointer-events: none;
  }

  .kpi-card:hover {
    transform: translateY(-3px) scale(1.01);
    box-shadow: var(--shadow-lg), var(--shadow-inset);
  }

  .kpi-card .kpi-icon {
    width: 44px;
    height: 44px;
    border-radius: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 14px;
    box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.4);
  }

  .kpi-card .kpi-val {
    font-family: var(--font-head);
    font-size: 2.1rem;
    font-weight: 700;
    color: var(--text-1);

    letter-spacing: -0.03em;
  }

  .kpi-card .kpi-label {
    font-size: 0.78rem;
    color: var(--text-2);

    letter-spacing: 0.6px;
    font-weight: 600;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 11px 20px;
    border-radius: var(--radius-sm);
    font-family: var(--font);
    font-size: 0.86rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.16s ease, background 0.12s ease, opacity 0.12s ease;
    border: none;
    position: relative;
    overflow: hidden;
    letter-spacing: -0.01em;
    isolation: isolate;
  }

  /* Universal glass sheen on every button */
  .btn::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.35) 0%, rgba(255, 255, 255, 0.05) 45%, transparent 60%);
    pointer-events: none;
    z-index: 1;
  }

  /* Press ripple */
  .btn::after {
    display: none;

  .btn:active {
    transform: scale(0.96);

  .btn span,

  .table-wrap {
    overflow-x: auto;
    border-radius: var(--radius);
  }

  .prog-bar-fill {
    height: 100%;
    background: var(--grad-prime);
    border-radius: 4px;
    transition: width 1s var(--ease);
    box-shadow: 0 0 8px rgba(26, 74, 110, 0.3);
  }

  .skeleton {
    background: linear-gradient(90deg, rgba(15, 23, 42, 0.04) 25%, rgba(15, 23, 42, 0.08) 50%, rgba(15, 23, 42, 0.04) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
    border-radius: 10px;
  }

  @keyframes shimmer {
    from {
      background-position: 200% 0;
    }

    to {
      background-position: -200% 0;
    }
  }

  .activity-item {
    display: flex;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid rgba(15, 23, 42, 0.05);
  }

  .activity-item:last-child {
    border-bottom: none;
  }

  .activity-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
    margin-top: 5px;
    box-shadow: 0 0 0 3px rgba(26, 74, 110, 0.1);
  }

  .activity-text {
    font-size: 0.85rem;
    color: var(--text-2);
  }

  .activity-time {
    font-size: 0.73rem;
    color: var(--text-3);
    margin-top: 3px;
  }

  .toast-wrap {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .toast {
    padding: 14px 20px;
    border-radius: var(--radius-sm);
    font-size: 0.88rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 10px;
    animation: toastSlide 0.45s var(--ease-bounce), toastOut 0.4s ease 2.7s forwards;
    box-shadow: var(--shadow-lg), var(--shadow-inset);
    min-width: 280px;
    backdrop-filter: blur(var(--blur-strong)) saturate(200%);
    -webkit-backdrop-filter: blur(var(--blur-strong)) saturate(200%);
    border: 1px solid var(--glass-border);
  }

  @keyframes toastSlide {
    from {
      opacity: 0;
      transform: translateX(60px) scale(0.9);
    }

    to {
      opacity: 1;
      transform: translateX(0) scale(1);
    }
  }

  .toast-success {
    background: rgba(48, 209, 88, 0.85);
    color: #fff;
  }

  .toast-error {
    background: rgba(255, 69, 58, 0.85);
    color: #fff;
  }

  .toast-info {
    background: rgba(0, 212, 255, 0.15);
    border: 1px solid rgba(0, 212, 255, 0.35);
    color: #00d4ff;
  }

  @keyframes toastOut {
    from {
      opacity: 1;
    }

    to {
      opacity: 0;
      transform: translateX(100%);
    }
  }

  /* DASHBOARD */
  .health-hero {
    background: var(--glass);
    backdrop-filter: blur(var(--blur)) saturate(180%);
    -webkit-backdrop-filter: blur(var(--blur)) saturate(180%);
    border: 1px solid var(--glass-border);
    border-radius: 24px;
    padding: 30px;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 24px;
    position: relative;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.22s cubic-bezier(0.34, 1.28, 0.64, 1), box-shadow 0.22s ease;
    box-shadow: var(--shadow-soft), var(--shadow-inset);
  }

  .health-hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 60% 100% at 0% 0%, rgba(26, 74, 110, 0.16), transparent 60%), radial-gradient(ellipse 60% 100% at 100% 100%, rgba(58, 132, 192, 0.12), transparent 60%);
    pointer-events: none;
  }

  .health-hero::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 45%;
    border-radius: 24px 24px 0 0;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.4), transparent);
    pointer-events: none;
  }

  .health-hero:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow-lg), var(--shadow-inset);
  }

  .health-hero>* {
    position: relative;
    z-index: 1;
  }

  .health-score-big {
    font-family: var(--font-head);
    font-size: 4.2rem;
    font-weight: 700;
    background: var(--grad-prime);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    line-height: 1.1;
    letter-spacing: -0.04em;
  }

  .health-label {
    font-size: 0.8rem;
    color: var(--text-3);
    text-transform: uppercase;
    letter-spacing: 1.2px;
    margin-top: 6px;
    font-weight: 600;
  }

  .health-desc {
    font-size: 0.92rem;
    color: var(--text-2);
    margin-top: 8px;
    line-height: 1.5;
  }

  .task-list {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .task-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 5px 4px;
    border-bottom: 1px solid rgba(26, 74, 110, 0.07);
    transition: background 0.1s ease;
    cursor: pointer;
    /* min-height: 0; */
  }

  .task-row:last-child {
    border-bottom: none;
  }

  .task-row:hover {
    background: rgba(26, 74, 110, 0.03);
  }

  .task-row.done .task-name {
    color: var(--text-3);
    text-decoration: line-through;
  }

  .task-check {
    width: 17px;
    height: 17px;
    border-radius: 5px;
    border: 1.5px solid rgba(26, 74, 110, 0.22);
    flex-shrink: 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255, 255, 255, 0.75);
    transition: background 0.14s ease, border-color 0.14s ease;
  }

  .task-check.done {
    background: var(--accent);
    border-color: var(--accent);
  }

  .task-check.done svg {
    stroke: #fff;
  }

  .task-check:hover:not(.done) {
    border-color: var(--accent);
    background: rgba(26, 74, 110, 0.06);
  }

  .task-name {
    font-size: 1rem;
    font-weight: 600;
    color: var(--text-1);
    line-height: 1.35;
  }

  .task-meta {
    font-size: 0.84rem;
    color: var(--text-3);
    margin-top: 3px;
    line-height: 1.3;
  }

  .task-right {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-left: auto;
    flex-shrink: 0;
  }

  .pri-H {
    background: rgba(192, 57, 43, 0.10);
    color: #a01f13;
    border: 1px solid rgba(192, 57, 43, 0.22);
  }

  .pri-M {
    background: rgba(212, 130, 10, 0.10);
    color: #7a4800;
    border: 1px solid rgba(212, 130, 10, 0.22);
  }

  .pri-L {
    background: rgba(26, 138, 74, 0.10);
    color: #0f6b35;
    border: 1px solid rgba(26, 138, 74, 0.22);
  }

  .late-badge {
    background: rgba(192, 57, 43, 0.10);
    color: #a01f13;
    border: 1px solid rgba(192, 57, 43, 0.22);
    border-radius: 20px;
    padding: 2px 7px;
    font-size: 0.68rem;
    font-weight: 700;
  }

  .btn-xs {
    padding: 4px 10px;
    font-size: 0.76rem;
    border-radius: 8px;
    font-weight: 600;
  }

  #taskBulkBar {
    display: none;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    background: rgba(26, 74, 110, 0.06);
    border-radius: var(--radius-sm);
    margin-bottom: 12px;
    border: 1px solid rgba(26, 74, 110, 0.12);
    flex-wrap: wrap;
  }

  /* GPU-accelerated table rendering */
  #tasksTbody tr,
  #todayTasksTbody tr {
    contain: layout style;
  }

  #tasksTbody td,
  #todayTasksTbody td {
    contain: layout;
  }

  .table-wrap {
    transform: translateZ(0);
    will-change: scroll-position;
  }

  /* Smooth scrolling for all scrollable areas */
  .main,
  .sidebar,
  .table-wrap,
  .modal,
  .cb-messages {
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
  }

  /* Hardware-accelerate sidebar and topbar - already have will-change but ensure */
  .sidebar,
  .topbar {
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }

  /* Reduce paint area for animations */
  .wow-card,
  .kpi-card,
  .glass-card {
    isolation: isolate;
  }

  .grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }

  .grid-3 {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
  }

  .leader-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 0;
    border-bottom: 1px solid rgba(15, 23, 42, 0.05);
  }

  .leader-rank {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 0.82rem;
    flex-shrink: 0;
  }

  .rank-1 {
    background: var(--grad-gold);
    color: #111;
  }

  .rank-2 {
    background: rgba(192, 192, 192, 0.2);
    color: #ccc;
  }

  .rank-3 {
    background: rgba(205, 127, 50, 0.2);
    color: #cd7f32;
  }

  .rank-other {
    background: rgba(15, 23, 42, 0.045);
    color: var(--text-3);
  }

  /* SA */
  .client-card {
    background: var(--grad-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    transition: background 0.08s ease, transform 0.08s ease, border-color 0.08s ease, box-shadow 0.08s ease;
    cursor: pointer;
  }

  .client-card:hover {
    border-color: var(--border-glow);
    transform: translateY(-3px);
    box-shadow: var(--shadow-glow);
  }

  .client-card .cc-head {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 14px;
  }

  .client-card .cc-avatar {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-head);
    font-weight: 800;
    font-size: 1rem;
    background: var(--grad-prime);
    color: #fff;
    flex-shrink: 0;
  }

  .client-card .cc-name {
    font-weight: 700;
    font-size: 0.95rem;
    color: var(--text-1);
  }

  .client-card .cc-email {
    font-size: 0.78rem;
    color: var(--text-3);
    margin-top: 2px;
  }

  .client-card .cc-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }

  .cc-stat {
    background: rgba(15, 23, 42, 0.03);
    border-radius: 8px;
    padding: 10px;
    text-align: center;
  }

  .cc-stat .cv {
    font-weight: 800;
    font-size: 1.1rem;
    color: var(--text-1);
  }

  .cc-stat .cl {
    font-size: 0.68rem;
    color: var(--text-3);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-top: 2px;
  }

  .clients-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 16px;
  }

  .chart-wrap {
    position: relative;
    height: 220px;
  }

  .chart-wrap canvas {
    max-height: 220px;
  }

  .ann-banner {
    background: linear-gradient(135deg, rgba(245, 197, 24, 0.1), rgba(255, 107, 107, 0.08));
    border: 1px solid rgba(245, 197, 24, 0.25);
    border-radius: var(--radius-sm);
    padding: 14px 18px;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 10px;
  }

  .expiry-warn {
    background: linear-gradient(135deg, rgba(255, 107, 107, 0.12), rgba(255, 152, 0, 0.1));
    border: 1px solid rgba(255, 107, 107, 0.3);
    border-radius: var(--radius-sm);
    padding: 12px 18px;
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
    font-size: 0.85rem;
    color: var(--accent3);
    font-weight: 600;
  }

  .toggle-switch {
    position: relative;
    width: 44px;
    height: 24px;
    cursor: pointer;
  }

  .toggle-switch input {
    opacity: 0;
    width: 0;
    height: 0;
    position: absolute;
  }

  .toggle-slider {
    position: absolute;
    inset: 0;
    background: rgba(255, 255, 255, 0.12);
    border-radius: 12px;
    transition: background 0.08s ease, transform 0.08s ease, border-color 0.08s ease, box-shadow 0.08s ease;
  }

  .toggle-slider::before {
    content: '';
    position: absolute;
    height: 18px;
    width: 18px;
    bottom: 3px;
    left: 3px;
    background: #fff;
    border-radius: 50%;
    transition: background 0.08s ease, transform 0.08s ease, border-color 0.08s ease, box-shadow 0.08s ease;
  }

  .toggle-switch input:checked+.toggle-slider {
    background: var(--accent4);
  }

  .toggle-switch input:checked+.toggle-slider::before {
    transform: translateX(20px);
  }

  #sidebarOverlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 99;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(4px);
  }

  #sidebarOverlay.show {
    display: block;
  }

  .drop-zone {
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    padding: 48px;
    text-align: center;
    cursor: pointer;
    transition: background 0.08s ease, transform 0.08s ease, border-color 0.08s ease, box-shadow 0.08s ease;
  }

  .drop-zone:hover,
  .drop-zone.drag-over {
    border-color: var(--accent);
    background: rgba(0, 212, 255, 0.05);
  }

  /* HOLIDAY PAGE */
  .holiday-item {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 14px 18px;
    background: rgba(15, 23, 42, 0.03);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    margin-bottom: 8px;
    transition: background 0.08s ease, transform 0.08s ease, border-color 0.08s ease, box-shadow 0.08s ease;
  }

  .holiday-item:hover {
    border-color: var(--border-glow);
  }

  .holiday-date {
    font-family: var(--font-head);
    font-size: 1rem;
    font-weight: 800;
    color: var(--accent);
    min-width: 80px;
  }

  .holiday-name {
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--text-1);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .holiday-type {
    font-size: 0.75rem;
    color: var(--text-3);
    margin-top: 2px;
  }


  /* SUBTASKS */
  .subtask-list {
    margin-top: 10px;
    padding-left: 16px;
    border-left: 2px solid var(--border);
  }

  .subtask-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 0;
    border-bottom: 1px solid rgba(15, 23, 42, 0.05);
  }

  .subtask-item:last-child {
    border-bottom: none;
  }

  .subtask-check {
    width: 18px;
    height: 18px;
    border-radius: 4px;
    border: 2px solid var(--border);
    flex-shrink: 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.08s ease, transform 0.08s ease, border-color 0.08s ease, box-shadow 0.08s ease;
  }

  .subtask-check.done {
    background: var(--accent4);
    border-color: transparent;
  }

  .subtask-name {
    font-size: 0.82rem;
    color: var(--text-2);
  }

  .subtask-name.done {
    text-decoration: line-through;
    color: var(--text-3);
  }

  .comment-item {
    display: flex;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid rgba(15, 23, 42, 0.05);
  }

  .comment-avatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--grad-prime);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.72rem;
    font-weight: 800;
    color: #fff;
    flex-shrink: 0;
  }

  .comment-body {
    flex: 1;
  }

  .comment-author {
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--text-1);
  }

  .comment-time {
    font-size: 0.68rem;
    color: var(--text-3);
    margin-left: 8px;
  }

  .comment-text {
    font-size: 0.83rem;
    color: var(--text-2);
    margin-top: 3px;
    line-height: 1.5;
  }

  .comment-input-wrap {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }

  .comment-input {
    flex: 1;
    background: rgba(15, 23, 42, 0.035);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    color: var(--text-1);
    font-family: var(--font);
    font-size: 0.85rem;
    outline: none;
  }

  .comment-input:focus {
    border-color: var(--accent);
  }

  /* APPROVAL BADGES */
  .badge-pending {
    background: rgba(255, 215, 64, 0.15);
    color: #ffd740;
    border: 1px solid rgba(255, 215, 64, 0.3);
  }

  #tvDashboard {
    position: fixed;
    inset: 0;
    z-index: 999;
    background: #020509;
    display: none;
    flex-direction: column;
    padding: 24px;
    gap: 16px;
  }

  #tvDashboard.active {
    display: flex;
  }

  .tv-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .tv-brand {
    font-family: var(--font-head);
    font-size: 2rem;
    font-weight: 800;
    background: var(--grad-prime);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .tv-time {
    font-family: var(--font-head);
    font-size: 1.4rem;
    color: var(--text-1);

    grid-template-columns: repeat(4, 1fr);

    padding: 24px;
    display: flex;
    flex-direction: column;
    justify-content: center;

  .tv-val {
    font-family: var(--font-head);
    font-size: 3.5rem;
    font-weight: 800;
    line-height: 1.1;

  .tv-label {
    font-size: 0.85rem;
    color: var(--text-3);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-top: 8px;
  }

  .tv-dept-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
  }

  .tv-dept-name {
    font-size: 0.9rem;
    font-weight: 700;
    color: var(--text-1);
    min-width: 120px;
  }

  .tv-dept-bar {
    flex: 1;
    height: 10px;
    background: rgba(15, 23, 42, 0.05);
    border-radius: 5px;
    overflow: hidden;
  }

  .tv-dept-fill {

    border-radius: 5px;
    transition: width 0.9s cubic-bezier(0.34, 1.1, 0.64, 1);

  .tv-dept-pct {
    font-size: 0.85rem;
    font-weight: 700;
    min-width: 44px;
    text-align: right;
  }

  .tv-ticker {
    background: rgba(0, 212, 255, 0.08);
    border-top: 1px solid rgba(0, 212, 255, 0.2);

    display: flex;
    align-items: center;
    gap: 12px;
    overflow: hidden;

  .tv-ticker-label {
    font-size: 0.75rem;
    font-weight: 700;

    text-transform: uppercase;
    letter-spacing: 1px;

    color: var(--text-2);

  @keyframes tickerScroll {
    from {
      transform: translateX(100vw);
    }

    to {
      transform: translateX(-100%);
    }
  }

  /* HEATMAP */
  .heatmap-grid {
    display: grid;
    grid-template-columns: repeat(24, 1fr);
    gap: 3px;
    margin-top: 8px;
  }

  .heatmap-cell {
    height: 28px;
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.08s ease, transform 0.08s ease, border-color 0.08s ease, box-shadow 0.08s ease;
    position: relative;
  }

  .heatmap-cell:hover::after {
    content: attr(data-tip);
    position: absolute;
    bottom: 110%;
    left: 50%;
    transform: translateX(-50%);
    background: var(--bg-mid);
    border: 1px solid var(--border);
    padding: 4px 8px;
    border-radius: 6px;
    font-size: 0.72rem;
    color: var(--text-1);
    white-space: nowrap;
    z-index: 10;
  }

  .heatmap-labels {
    display: grid;
    grid-template-columns: repeat(24, 1fr);
    gap: 3px;
    margin-top: 4px;
  }

  .heatmap-label {
    font-size: 0.62rem;
    color: var(--text-3);
    text-align: center;
  }

  .heatmap-day-row {
    margin-bottom: 6px;
  }

  .heatmap-day-label {
    font-size: 0.72rem;
    color: var(--text-3);
    width: 36px;

  /* ── GLASS CARD ── */
  .glass-card {
    background: rgba(255, 255, 255, 0.68);

    top: 0;
    left: 0;
    right: 0;
    height: 50%;
